<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nepali Panas Event Opening</title>
    <link rel="stylesheet" href="styles.css?v=cinematic11" />
  </head>
  <body>
    <main class="experience" aria-live="polite">
      <section class="lighting-scene" aria-label="Nepali Panas lighting ceremony">
        <div class="panas-stage">
          <div class="top-glow" aria-hidden="true"></div>
          <div class="heat-haze" aria-hidden="true"></div>
          <div class="ember-layer" id="emberLayer" aria-hidden="true"></div>
          <div class="flame-stack is-igniting" aria-hidden="true">
            <span class="flame flame-outer"></span>
            <span class="flame flame-mid"></span>
            <span class="flame flame-core"></span>
          </div>
          <div class="ignition-spark" aria-hidden="true"></div>
          <img class="panas-image" src="panas-main.png" alt="Traditional Nepali Panas ceremonial lamp" />
        </div>
      </section>

      <section class="event-screen" aria-label="Main event opening screen">
        <div class="event-aurora" aria-hidden="true"></div>
        <div class="curtain curtain-left" aria-hidden="true"></div>
        <div class="curtain curtain-right" aria-hidden="true"></div>
        <article class="event-poster">
          <div class="poster-light" aria-hidden="true"></div>
          <div class="poster-image-wrap">
            <img src="panas-main.png" alt="" />
          </div>
          <div class="poster-content">
            <p class="poster-kicker">CAN presents</p>
            <h1>Digital Literacy</h1>
          </div>
        </article>
      </section>
    </main>

    <script src="script.js?v=cinematic11"></script>
  </body>
</html>
