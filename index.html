<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyxen</title>
    <link rel="stylesheet" href="styles.css?v=cinematic23" />
  </head>
  <body>
    <main class="experience" aria-live="polite">
      <section
        class="lighting-scene"
        aria-label="Nepali Panas lighting ceremony"
      >
        <div class="scene-background" aria-hidden="true">
          <div class="radial-glow-back"></div>
          <svg class="mandala-svg" viewBox="0 0 500 500" fill="none" stroke="url(#goldGradient)" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff8eb" stop-opacity="1" />
                <stop offset="30%" stop-color="#ffba62" stop-opacity="0.85" />
                <stop offset="65%" stop-color="#ff7a1a" stop-opacity="0.4" />
                <stop offset="100%" stop-color="#1b0800" stop-opacity="0.05" />
              </radialGradient>
            </defs>
            <circle cx="250" cy="250" r="240" stroke-width="1" stroke-dasharray="6 6" />
            <circle cx="250" cy="250" r="230" stroke-width="1.5" />
            <circle cx="250" cy="250" r="215" stroke-width="1" />
            <g class="mandala-petals">
              <circle cx="250" cy="250" r="195" stroke-width="2" stroke-dasharray="14 7" />
              <circle cx="250" cy="250" r="180" stroke-width="1" stroke-dasharray="3 3" />
              <circle cx="250" cy="250" r="165" stroke-width="2" stroke-dasharray="28 10" />
              <circle cx="250" cy="250" r="150" stroke-width="1.5" />
              <circle cx="250" cy="250" r="130" stroke-width="2" stroke-dasharray="10 5" />
              <circle cx="250" cy="250" r="110" stroke-width="1" />
              <circle cx="250" cy="250" r="95" stroke-width="3" stroke-dasharray="20 8" />
              <circle cx="250" cy="250" r="75" stroke-width="1.5" />
              <circle cx="250" cy="250" r="55" stroke-width="1" stroke-dasharray="6 3" />
              <circle cx="250" cy="250" r="35" stroke-width="2" />
              <circle cx="250" cy="250" r="15" stroke-width="1" />
            </g>
            <g class="mandala-spokes">
              <line x1="250" y1="10" x2="250" y2="490" stroke-width="0.5" opacity="0.6" />
              <line x1="10" y1="250" x2="490" y2="250" stroke-width="0.5" opacity="0.6" />
              <line x1="80" y1="80" x2="420" y2="420" stroke-width="0.5" opacity="0.6" />
              <line x1="420" y1="80" x2="80" y2="420" stroke-width="0.5" opacity="0.6" />
              <line x1="130" y1="42" x2="370" y2="458" stroke-width="0.5" opacity="0.4" />
              <line x1="370" y1="42" x2="130" y2="458" stroke-width="0.5" opacity="0.4" />
              <line x1="42" y1="130" x2="458" y2="370" stroke-width="0.5" opacity="0.4" />
              <line x1="42" y1="370" x2="458" y2="130" stroke-width="0.5" opacity="0.4" />
            </g>
          </svg>
          <div class="sparks">
            <div class="sparks-bg">
              <div class="spark spark-bg-1"></div>
              <div class="spark spark-bg-2"></div>
              <div class="spark spark-bg-3"></div>
              <div class="spark spark-bg-4"></div>
            </div>
            <div class="sparks-mid">
              <div class="spark spark-mid-1"></div>
              <div class="spark spark-mid-2"></div>
              <div class="spark spark-mid-3"></div>
              <div class="spark spark-mid-4"></div>
            </div>
            <div class="sparks-fg">
              <div class="spark spark-fg-1"></div>
              <div class="spark spark-fg-2"></div>
              <div class="spark spark-fg-3"></div>
            </div>
          </div>
        </div>
        <div class="panas-stage">
          <div class="top-glow" aria-hidden="true"></div>
          <div class="heat-shimmer" aria-hidden="true"></div>
          <div class="flame-stack" aria-hidden="true">
            <span class="flame flame-outer"></span>
            <span class="flame flame-mid"></span>
            <span class="flame flame-core"></span>
          </div>
          <div class="ignition-spark" aria-hidden="true"></div>
          <img
            class="panas-image"
            src="panas-main.png"
            alt="Traditional Nepali Panas ceremonial lamp"
            decoding="async"
            fetchpriority="high"
          />
        </div>
      </section>

      <section class="event-screen" aria-label="Opening visuals">
        <div class="curtain-left curtain" aria-hidden="true"></div>
        <div class="curtain-right curtain" aria-hidden="true"></div>
        <div
          class="closing-curtain-left closing-curtain"
          aria-hidden="true"
        ></div>
        <div
          class="closing-curtain-right closing-curtain"
          aria-hidden="true"
        ></div>
        <div class="full-visual">
          <img
            class="sequence-image"
            id="sequenceImage"
            src=""
            alt=""
            decoding="async"
            loading="lazy"
          />
        </div>
        <div id="welcomeOverlay" class="welcome-overlay" aria-hidden="true">
          <h1 class="welcome-text">Welcome Everyone</h1>
        </div>
      </section>

      <audio
        id="openingMusic"
        src="m1.mp3"
        preload="none"
        muted
        playsinline
      ></audio>
      <audio
        id="clappingSound"
        src="clapping.mp3"
        preload="auto"
      ></audio>
      <audio
        id="curtainOpenSound"
        src="curtain-open.mp3"
        preload="auto"
      ></audio>
      <audio
        id="curtainCloseSound"
        src="curtain-close.mp3"
        preload="auto"
      ></audio>
    </main>

    <script src="script.js?v=cinematic22"></script>
  </body>
</html>
