<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyxen</title>
    <link rel="stylesheet" href="styles.css?v=cinematic19" />
  </head>
  <body>
    <main class="experience" aria-live="polite">
      <section
        class="lighting-scene"
        aria-label="Nepali Panas lighting ceremony"
      >
        <div class="panas-stage">
          <div class="top-glow" aria-hidden="true"></div>
          <div class="heat-haze" aria-hidden="true"></div>
          <div class="ember-layer" id="emberLayer" aria-hidden="true"></div>
          <div class="flame-stack" aria-hidden="true">
            <span class="flame flame-outer"></span>
            <span class="flame flame-mid"></span>
            <span class="flame flame-core"></span>
          </div>
          <div class="ignition-spark" aria-hidden="true"></div>
          <img
            class="panas-image"
            src="panas-main.png"
            alt="Traditional Nepali Panas ceremonial lamp"
          />
        </div>
      </section>

      <section class="event-screen" aria-label="Opening visuals">
        <div class="event-aurora" aria-hidden="true"></div>
        <div class="curtain-left curtain" aria-hidden="true"></div>
        <div class="curtain-right curtain" aria-hidden="true"></div>
        <div
          class="closing-curtain-left closing-curtain"
          aria-hidden="true"
        ></div>
        <div
          class="closing-curtain-right closing-curtain"
          aria-hidden="true"
        ></div>
        <div class="full-visual">
          <img
            class="sequence-image is-active"
            id="sequenceImage"
            src="can image 0.jpg"
            alt="CAN presentation visual"
          />
        </div>
      </section>

      <audio
        id="openingMusic"
        src="m1.mp3"
        preload="auto"
        autoplay
        muted
        playsinline
      ></audio>
    </main>

    <script src="script.js?v=cinematic19"></script>
  </body>
</html>
